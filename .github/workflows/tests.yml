name: Tests et modele livre
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Pas de PYTHONUTF8 : Windows garde son encodage par défaut (cp1252), comme sur un poste réel.
    # Tout fichier texte ouvert sans encoding= dans notre code fait échouer pytest (voir pyproject.toml).
    env:
      PYTHONWARNDEFAULTENCODING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12.7"
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - run: uv run --locked python -m src.play --state 15 10 0
      - run: uv run --locked python -m src.play --games 5 --seed 2030 --trace
  mathematical-documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX dependencies
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-lang-french texlive-fonts-recommended lmodern
      - name: Compile mathematical documents without replacing published PDFs
        run: python scripts/build_docs.py --check
