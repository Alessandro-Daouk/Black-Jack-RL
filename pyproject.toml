[project]
name = "blackjack-rl"
version = "0.1.0"
description = "Agent de blackjack hybride : probabilités supervisées et Q-learning, expériences reproductibles."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.0,<2",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "pandas>=3.1,<4",
    "scikit-learn>=1.5,<2",
    "scipy>=1.15,<2",
]

[project.optional-dependencies]
notebook = ["ipykernel>=7.4,<8"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
